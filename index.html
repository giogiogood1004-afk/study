<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 반 스터디 랭킹</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --primary:#4f46e5;
    --primary-light:#eef2ff;
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#1e293b;
    --muted:#64748b;
    --border:#e2e8f0;
    --gold:#fbbf24;
    --silver:#cbd5e1;
    --bronze:#f59e0b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px 16px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  header{text-align:center;margin-bottom:24px;}
  header h1{font-size:26px;margin:0 0 6px;}
  header p{color:var(--muted);margin:0;font-size:14px;}

  .setup-banner{
    background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
    padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:20px;
    display:none;
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 1px 2px rgba(0,0,0,0.03);
  }
  .card h2{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:6px;}

  form.log-form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:100px;}
  .field label{font-size:12px;color:var(--muted);}
  .field input,.field select{
    padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;
    background:#fff;
  }
  button{
    background:var(--primary);color:#fff;border:none;border-radius:8px;
    padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  button:hover{background:#4338ca;}
  button:disabled{background:#c7d2fe;cursor:not-allowed;}

  .tabs{display:flex;gap:8px;margin-bottom:14px;}
  .tab-btn{
    background:var(--primary-light);color:var(--primary);border:none;border-radius:20px;
    padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .tab-btn.active{background:var(--primary);color:#fff;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;font-size:12px;}
  tr:last-child td{border-bottom:none;}
  .rank{font-weight:700;width:36px;}
  .rank.gold{color:var(--gold);}
  .rank.silver{color:#94a3b8;}
  .rank.bronze{color:var(--bronze);}
  .name-cell{font-weight:600;}
  .time-cell{color:var(--primary);font-weight:700;}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}
  .chart-wrap{max-width:520px;margin:0 auto;}
  .status{font-size:12px;color:var(--muted);margin-top:8px;}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 우리 반 스터디 랭킹</h1>
    <p>오늘의 공부 시간을 기록하고 반 친구들과 함께 확인해요</p>
  </header>

  <div class="setup-banner" id="setupBanner">
    ⚠️ 아직 데이터 저장소(Google Apps Script) 주소가 연결되지 않았어요. 파일 상단의 <code>API_URL</code> 값을 배포한 웹앱 주소로 바꿔주세요. (설정 전에는 이 브라우저에만 임시 저장됩니다.)
  </div>

  <div class="card">
    <h2>✏️ 공부 시간 기록하기</h2>
    <form class="log-form" id="logForm">
      <div class="field">
        <label>이름</label>
        <input type="text" id="nameInput" placeholder="예: 김지오" required>
      </div>
      <div class="field">
        <label>과목</label>
        <select id="subjectInput">
          <option>국어</option>
          <option>영어</option>
          <option>수학</option>
          <option>과학</option>
          <option>사회</option>
          <option>정보/코딩</option>
          <option>기타</option>
        </select>
      </div>
      <div class="field" style="flex:0 0 90px;">
        <label>시간(분)</label>
        <input type="number" id="minutesInput" min="1" max="600" placeholder="60" required>
      </div>
      <button type="submit" id="submitBtn">기록하기</button>
    </form>
    <div class="status" id="formStatus"></div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" data-range="today">오늘</button>
      <button class="tab-btn" data-range="week">이번 주</button>
      <button class="tab-btn" data-range="all">전체 누적</button>
    </div>
    <h2 id="rankTitle">🏆 오늘의 랭킹</h2>
    <table>
      <thead>
        <tr><th class="rank">순위</th><th>이름</th><th>공부 시간</th></tr>
      </thead>
      <tbody id="rankBody"></tbody>
    </table>
    <div class="empty" id="rankEmpty" style="display:none;">아직 기록이 없어요. 첫 기록을 남겨보세요!</div>
  </div>

  <div class="card">
    <h2>📊 과목별 반 전체 공부 시간 (전체 누적)</h2>
    <div class="chart-wrap"><canvas id="subjectChart"></canvas></div>
  </div>

  <footer>학급 자율활동 · 학습시간 랭킹 웹사이트</footer>
</div>

<script>
/* ====================== 설정 ======================
  아래 API_URL에 Google Apps Script 웹앱 배포 URL을 붙여넣으세요.
  (배포 방법은 함께 드린 안내 문서 참고)
  비워두면 이 브라우저에만 데이터가 저장되는 데모 모드로 동작합니다.
=====================================================*/
const API_URL = "https://script.google.com/macros/s/AKfycby9MwF3SQmpOdzPgJTZwswnt6Mmmtf-oy4xKmQPPqW1LoKhf11pTk5HH7o31ud-UhKp/exec"; // 예: "https://script.google.com/macros/s/AKfycb.../exec"

const LOCAL_KEY = "studyRankingRecords";

function loadLocalRecords(){
  try{ return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); }
  catch(e){ return []; }
}
function saveLocalRecords(records){
  localStorage.setItem(LOCAL_KEY, JSON.stringify(records));
}

async function fetchRecords(){
  if(API_URL){
    const res = await fetch(API_URL);
    const data = await res.json();
    return data.records || [];
  }
  return loadLocalRecords();
}

async function submitRecord(record){
  if(API_URL){
    await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain"},
      body: JSON.stringify(record)
    });
  } else {
    const records = loadLocalRecords();
    records.push(record);
    saveLocalRecords(records);
  }
}

function todayStr(d = new Date()){
  return d.toISOString().slice(0,10);
}
function startOfWeek(d = new Date()){
  const day = d.getDay() === 0 ? 7 : d.getDay(); // 월=1 ... 일=7
  const monday = new Date(d);
  monday.setDate(d.getDate() - day + 1);
  monday.setHours(0,0,0,0);
  return monday;
}

let currentRange = "today";
let subjectChart = null;

function filterByRange(records, range){
  const now = new Date();
  if(range === "today"){
    const t = todayStr(now);
    return records.filter(r => r.date === t);
  }
  if(range === "week"){
    const monday = startOfWeek(now);
    return records.filter(r => new Date(r.date) >= monday);
  }
  return records;
}

function aggregateByName(records){
  const map = {};
  records.forEach(r => {
    const mins = Number(r.minutes) || 0;
    map[r.name] = (map[r.name] || 0) + mins;
  });
  return Object.entries(map)
    .map(([name, minutes]) => ({name, minutes}))
    .sort((a,b) => b.minutes - a.minutes);
}

function aggregateBySubject(records){
  const map = {};
  records.forEach(r => {
    const mins = Number(r.minutes) || 0;
    map[r.subject] = (map[r.subject] || 0) + mins;
  });
  return map;
}

function formatMinutes(mins){
  const h = Math.floor(mins/60);
  const m = mins % 60;
  if(h === 0) return `${m}분`;
  if(m === 0) return `${h}시간`;
  return `${h}시간 ${m}분`;
}

function renderRanking(records){
  const filtered = filterByRange(records, currentRange);
  const ranked = aggregateByName(filtered);
  const body = document.getElementById("rankBody");
  const empty = document.getElementById("rankEmpty");
  body.innerHTML = "";

  if(ranked.length === 0){
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  const medalClass = ["gold","silver","bronze"];
  ranked.forEach((row, idx) => {
    const tr = document.createElement("tr");
    const rankLabel = idx < 3 ? ["🥇","🥈","🥉"][idx] : (idx+1);
    tr.innerHTML = `
      <td class="rank ${medalClass[idx] || ""}">${rankLabel}</td>
      <td class="name-cell">${row.name}</td>
      <td class="time-cell">${formatMinutes(row.minutes)}</td>
    `;
    body.appendChild(tr);
  });
}

function renderChart(records){
  const bySubject = aggregateBySubject(records);
  const labels = Object.keys(bySubject);
  const data = Object.values(bySubject);

  const ctx = document.getElementById("subjectChart");
  if(subjectChart) subjectChart.destroy();
  subjectChart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: ["#4f46e5","#818cf8","#a5b4fc","#c7d2fe","#fbbf24","#f59e0b","#34d399"]
      }]
    },
    options: {
      plugins:{ legend:{ position:"bottom", labels:{ font:{ size:12 } } } }
    }
  });
}

async function refreshAll(){
  const records = await fetchRecords();
  renderRanking(records);
  renderChart(records);
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentRange = btn.dataset.range;
    const titles = {today:"🏆 오늘의 랭킹", week:"🏆 이번 주 랭킹", all:"🏆 전체 누적 랭킹"};
    document.getElementById("rankTitle").textContent = titles[currentRange];
    refreshAll();
  });
});

document.getElementById("logForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("nameInput").value.trim();
  const subject = document.getElementById("subjectInput").value;
  const minutes = Number(document.getElementById("minutesInput").value);
  if(!name || !minutes || minutes <= 0) return;

  const submitBtn = document.getElementById("submitBtn");
  const statusEl = document.getElementById("formStatus");
  submitBtn.disabled = true;
  statusEl.textContent = "저장 중...";

  try{
    await submitRecord({
      name, subject, minutes,
      date: todayStr(),
      timestamp: new Date().toISOString()
    });
    document.getElementById("minutesInput").value = "";
    statusEl.textContent = "저장 완료! 랭킹에 반영됐어요.";
    await refreshAll();
  }catch(err){
    statusEl.textContent = "저장 실패: 인터넷 연결이나 API 주소를 확인해주세요.";
  }finally{
    submitBtn.disabled = false;
    setTimeout(() => statusEl.textContent = "", 2500);
  }
});

if(!API_URL){
  document.getElementById("setupBanner").style.display = "block";
}
refreshAll();
</script>
</body>
</html>
