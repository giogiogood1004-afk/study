<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>우리 반 스터디 랭킹</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --primary:#6366f1;
    --primary-dark:#4f46e5;
    --primary-light:#eef2ff;
    --accent:#ec4899;
    --bg:#f4f5f9;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#6b7280;
    --border:#e5e7eb;
    --gold:#d97706;
    --gold-bg:#fffbeb;
    --silver:#6b7280;
    --silver-bg:#f9fafb;
    --bronze:#c2703d;
    --bronze-bg:#fff7ed;
    --shadow-sm:0 1px 2px rgba(15,23,42,0.04);
    --shadow-md:0 4px 16px rgba(15,23,42,0.06);
    --shadow-lg:0 12px 32px rgba(15,23,42,0.10);
    --radius-lg:22px;
  }
  html[data-theme="dark"]{
    --primary:#818cf8;
    --primary-dark:#a5b4fc;
    --primary-light:#26265c;
    --accent:#f472b6;
    --bg:#0b0f1a;
    --card:#151b2b;
    --text:#f3f4f6;
    --muted:#9199a8;
    --border:#262f42;
    --gold:#fbbf24;
    --gold-bg:#332707;
    --silver:#c3c9d4;
    --silver-bg:#1c2333;
    --bronze:#f0a868;
    --bronze-bg:#331f0f;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow-md:0 4px 16px rgba(0,0,0,0.35);
    --shadow-lg:0 16px 40px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:"Pretendard","-apple-system",BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:
      radial-gradient(600px circle at 15% -10%, color-mix(in srgb, var(--primary) 10%, transparent), transparent 60%),
      var(--bg);
    color:var(--text);
    padding:22px 14px 70px;
    transition:background 0.3s ease, color 0.3s ease;
    letter-spacing:-0.1px;
  }
  .wrap{max-width:880px;margin:0 auto;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:26px;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-icon{
    width:40px;height:40px;border-radius:13px;flex:0 0 40px;
    background:linear-gradient(135deg,var(--primary),var(--accent));
    display:flex;align-items:center;justify-content:center;font-size:19px;
    box-shadow:0 4px 12px color-mix(in srgb, var(--primary) 40%, transparent);
  }
  .brand-text h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-0.3px;}
  .brand-text p{color:var(--muted);margin:1px 0 0;font-size:12.5px;font-weight:500;}

  .theme-toggle{
    background:var(--card);border:1px solid var(--border);border-radius:999px;
    width:40px;height:40px;flex:0 0 40px;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;cursor:pointer;box-shadow:var(--shadow-sm);
    transition:transform 0.15s ease, box-shadow 0.2s ease;
  }
  .theme-toggle:hover{box-shadow:var(--shadow-md);}
  .theme-toggle:active{transform:scale(0.88);}

  .setup-banner{
    background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
    padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:20px;
    display:none;
  }
  html[data-theme="dark"] .setup-banner{
    background:#332707;border-color:#7c4a12;color:#fdba74;
  }

  .stats-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;
  }
  .stat-card{
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:14px 14px;box-shadow:var(--shadow-sm);
    animation:fadeUp 0.4s ease both;
  }
  .stat-card .stat-label{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:5px;}
  .stat-card .stat-value{font-size:19px;font-weight:800;letter-spacing:-0.4px;}
  .stat-card .stat-value.accent{color:var(--primary);}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:22px;
    margin-bottom:16px;
    box-shadow:var(--shadow-md);
    animation:fadeUp 0.45s ease both;
    transition:background 0.3s ease, border-color 0.3s ease, box-shadow 0.25s ease;
  }
  .card:hover{box-shadow:var(--shadow-lg);}
  .card:nth-of-type(2){animation-delay:0.05s;}
  .card:nth-of-type(3){animation-delay:0.1s;}
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(12px);}
    to{opacity:1;transform:translateY(0);}
  }

  .card h2{font-size:15.5px;margin:0 0 16px;display:flex;align-items:center;gap:7px;font-weight:800;letter-spacing:-0.2px;}

  form.log-form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:110px;}
  .field label{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
  .field input,.field select{
    padding:12px 13px;border:1.5px solid var(--border);border-radius:12px;font-size:14.5px;
    background:var(--bg);color:var(--text);font-weight:500;
    transition:border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .field input:focus,.field select:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-light);
    background:var(--card);
  }
  button{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;border:none;border-radius:12px;
    padding:12px 22px;font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap;
    transition:transform 0.12s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    box-shadow:0 4px 14px color-mix(in srgb, var(--primary) 35%, transparent);
    letter-spacing:-0.1px;
  }
  button:hover{transform:translateY(-2px);box-shadow:0 6px 18px color-mix(in srgb, var(--primary) 45%, transparent);}
  button:active{transform:translateY(0) scale(0.97);}
  button:disabled{background:#c7d2fe;box-shadow:none;cursor:not-allowed;transform:none;}

  .segmented{
    position:relative;display:flex;background:var(--bg);border-radius:999px;
    padding:4px;margin-bottom:18px;border:1px solid var(--border);
  }
  .segmented-indicator{
    position:absolute;top:4px;bottom:4px;left:4px;
    width:calc((100% - 8px) / 3);
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    border-radius:999px;transition:transform 0.28s cubic-bezier(.4,0,.2,1);
    box-shadow:0 3px 10px color-mix(in srgb, var(--primary) 40%, transparent);
    z-index:0;
  }
  .tab-btn{
    position:relative;z-index:1;flex:1;background:transparent;color:var(--muted);border:none;
    padding:9px 10px;font-size:13px;font-weight:700;cursor:pointer;border-radius:999px;
    box-shadow:none;transition:color 0.2s ease;
  }
  .tab-btn.active{color:#fff;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{padding:12px 8px;text-align:left;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;}
  tr:last-child td{border-bottom:none;}
  tbody tr{transition:background 0.15s ease;animation:fadeIn 0.35s ease both;}
  tbody tr:hover{background:var(--bg);}
  @keyframes fadeIn{from{opacity:0;transform:translateX(-4px);}to{opacity:1;transform:translateX(0);}}

  tr.top1 td, tr.top2 td, tr.top3 td{font-weight:700;}
  tr.top1{background:var(--gold-bg);}
  tr.top2{background:var(--silver-bg);}
  tr.top3{background:var(--bronze-bg);}

  .rank{font-weight:800;width:36px;font-size:14.5px;}
  .rank.gold{color:var(--gold);}
  .rank.silver{color:var(--silver);}
  .rank.bronze{color:var(--bronze);}

  .name-cell{font-weight:700;display:flex;align-items:center;gap:9px;}
  .avatar{
    width:28px;height:28px;border-radius:9px;flex:0 0 28px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:12.5px;font-weight:800;
  }
  .time-cell{color:var(--primary);font-weight:800;font-variant-numeric:tabular-nums;}

  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:32px 0;}
  .empty .empty-icon{font-size:26px;display:block;margin-bottom:8px;opacity:0.6;}
  .chart-wrap{max-width:460px;margin:0 auto;position:relative;min-height:180px;}
  .status{font-size:12.5px;color:var(--muted);margin-top:10px;min-height:16px;font-weight:500;}
  .status.success{color:#16a34a;font-weight:700;}
  .status.error{color:#dc2626;font-weight:700;}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px;font-weight:500;}

  .spinner{
    width:16px;height:16px;border-radius:50%;
    border:2.5px solid var(--border);border-top-color:var(--primary);
    display:inline-block;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:520px){
    .brand-text h1{font-size:16px;}
    .brand-text p{font-size:11.5px;}
    .stats-grid{gap:8px;}
    .stat-card{padding:11px 10px;border-radius:13px;}
    .stat-card .stat-value{font-size:16px;}
    .field{min-width:100%;}
    button[type="submit"]{width:100%;}
    .card{padding:17px;border-radius:18px;}
    th,td{padding:10px 6px;font-size:12.5px;}
    .avatar{width:24px;height:24px;font-size:11px;border-radius:8px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">📚</div>
      <div class="brand-text">
        <h1>우리 반 스터디 랭킹</h1>
        <p>오늘도 함께 공부해요</p>
      </div>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="다크모드 전환">🌙</button>
  </div>

  <div class="setup-banner" id="setupBanner">
    ⚠️ 아직 데이터 저장소(Google Apps Script) 주소가 연결되지 않았어요. 파일 상단의 <code>API_URL</code> 값을 배포한 웹앱 주소로 바꿔주세요. (설정 전에는 이 브라우저에만 임시 저장됩니다.)
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">👥 참여 인원</div>
      <div class="stat-value" id="statPeople">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">⏱️ 전체 누적</div>
      <div class="stat-value accent" id="statTotal">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">🔥 오늘 기록</div>
      <div class="stat-value" id="statToday">-</div>
    </div>
  </div>

  <div class="card">
    <h2>✏️ 공부 시간 기록하기</h2>
    <form class="log-form" id="logForm">
      <div class="field">
        <label>이름</label>
        <input type="text" id="nameInput" placeholder="예: 김지오" required>
      </div>
      <div class="field">
        <label>과목</label>
        <select id="subjectInput">
          <option>국어</option>
          <option>영어</option>
          <option>수학</option>
          <option>과학</option>
          <option>사회</option>
          <option>정보/코딩</option>
          <option>기타</option>
        </select>
      </div>
      <div class="field" style="flex:0 0 100px;">
        <label>시간(분)</label>
        <input type="number" id="minutesInput" min="1" max="600" placeholder="60" required>
      </div>
      <button type="submit" id="submitBtn">기록하기</button>
    </form>
    <div class="status" id="formStatus"></div>
  </div>

  <div class="card">
    <div class="segmented">
      <div class="segmented-indicator" id="segIndicator"></div>
      <button class="tab-btn active" data-range="today">오늘</button>
      <button class="tab-btn" data-range="week">이번 주</button>
      <button class="tab-btn" data-range="all">전체 누적</button>
    </div>
    <h2 id="rankTitle">🏆 오늘의 랭킹</h2>
    <table>
      <thead>
        <tr><th class="rank">순위</th><th>이름</th><th>공부 시간</th></tr>
      </thead>
      <tbody id="rankBody"></tbody>
    </table>
    <div class="empty" id="rankEmpty" style="display:none;">
      <span class="empty-icon">📭</span>아직 기록이 없어요. 첫 기록을 남겨보세요!
    </div>
  </div>

  <div class="card">
    <h2>📊 과목별 반 전체 공부 시간</h2>
    <div class="chart-wrap"><canvas id="subjectChart"></canvas></div>
  </div>

  <footer>학급 자율활동 · 학습시간 랭킹 웹사이트</footer>
</div>

<script>
/* ====================== 설정 ======================
  아래 API_URL에 Google Apps Script 웹앱 배포 URL을 붙여넣으세요.
  (배포 방법은 함께 드린 안내 문서 참고)
  비워두면 이 브라우저에만 데이터가 저장되는 데모 모드로 동작합니다.
=====================================================*/
const API_URL = "https://script.google.com/macros/s/AKfycby9MwF3SQmpOdzPgJTZwswnt6Mmmtf-oy4xKmQPPqW1LoKhf11pTk5HH7o31ud-UhKp/exec"; // 예: "https://script.google.com/macros/s/AKfycb.../exec"

const LOCAL_KEY = "studyRankingRecords";
const THEME_KEY = "studyRankingTheme";
const AVATAR_COLORS = ["#6366f1","#ec4899","#f59e0b","#10b981","#3b82f6","#ef4444","#8b5cf6","#14b8a6"];

/* ---------- 다크모드 ---------- */
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("themeToggle").textContent = theme === "dark" ? "☀️" : "🌙";
  localStorage.setItem(THEME_KEY, theme);
}
function initTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  if(saved){ applyTheme(saved); return; }
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(prefersDark ? "dark" : "light");
}
document.getElementById("themeToggle").addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  applyTheme(current === "dark" ? "light" : "dark");
  if(subjectChart) renderChart(lastRecords);
});
initTheme();

function loadLocalRecords(){
  try{ return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); }
  catch(e){ return []; }
}
function saveLocalRecords(records){
  localStorage.setItem(LOCAL_KEY, JSON.stringify(records));
}

async function fetchRecords(){
  if(API_URL){
    const res = await fetch(API_URL);
    const data = await res.json();
    return data.records || [];
  }
  return loadLocalRecords();
}

async function submitRecord(record){
  if(API_URL){
    await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain"},
      body: JSON.stringify(record)
    });
  } else {
    const records = loadLocalRecords();
    records.push(record);
    saveLocalRecords(records);
  }
}

function todayStr(d = new Date()){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function startOfWeek(d = new Date()){
  const day = d.getDay() === 0 ? 7 : d.getDay();
  const monday = new Date(d);
  monday.setDate(d.getDate() - day + 1);
  monday.setHours(0,0,0,0);
  return monday;
}

function hashColor(str){
  let hash = 0;
  for(let i=0;i<str.length;i++){ hash = str.charCodeAt(i) + ((hash << 5) - hash); }
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

let currentRange = "today";
let subjectChart = null;
let lastRecords = [];

function filterByRange(records, range){
  const now = new Date();
  if(range === "today"){
    const t = todayStr(now);
    return records.filter(r => r.date === t);
  }
  if(range === "week"){
    const monday = startOfWeek(now);
    return records.filter(r => new Date(r.date) >= monday);
  }
  return records;
}

function aggregateByName(records){
  const map = {};
  records.forEach(r => {
    const mins = Number(r.minutes) || 0;
    map[r.name] = (map[r.name] || 0) + mins;
  });
  return Object.entries(map)
    .map(([name, minutes]) => ({name, minutes}))
    .sort((a,b) => b.minutes - a.minutes);
}

function aggregateBySubject(records){
  const map = {};
  records.forEach(r => {
    const mins = Number(r.minutes) || 0;
    map[r.subject] = (map[r.subject] || 0) + mins;
  });
  return map;
}

function formatMinutes(mins){
  const h = Math.floor(mins/60);
  const m = mins % 60;
  if(h === 0) return `${m}분`;
  if(m === 0) return `${h}시간`;
  return `${h}시간 ${m}분`;
}

function renderStats(records){
  const allNames = new Set(records.map(r => r.name));
  const totalMins = records.reduce((sum,r) => sum + (Number(r.minutes)||0), 0);
  const todayRecords = filterByRange(records, "today");

  document.getElementById("statPeople").textContent = `${allNames.size}명`;
  document.getElementById("statTotal").textContent = formatMinutes(totalMins);
  document.getElementById("statToday").textContent = `${todayRecords.length}건`;
}

function renderRanking(records){
  const filtered = filterByRange(records, currentRange);
  const ranked = aggregateByName(filtered);
  const body = document.getElementById("rankBody");
  const empty = document.getElementById("rankEmpty");
  body.innerHTML = "";

  if(ranked.length === 0){
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  const medalClass = ["gold","silver","bronze"];
  const rowClass = ["top1","top2","top3"];
  ranked.forEach((row, idx) => {
    const tr = document.createElement("tr");
    if(rowClass[idx]) tr.classList.add(rowClass[idx]);
    tr.style.animationDelay = `${idx * 0.03}s`;
    const rankLabel = idx < 3 ? ["🥇","🥈","🥉"][idx] : (idx+1);
    const initial = row.name.trim().charAt(0) || "?";
    tr.innerHTML = `
      <td class="rank ${medalClass[idx] || ""}">${rankLabel}</td>
      <td class="name-cell">
        <span class="avatar" style="background:${hashColor(row.name)}">${initial}</span>
        ${row.name}
      </td>
      <td class="time-cell">${formatMinutes(row.minutes)}</td>
    `;
    body.appendChild(tr);
  });
}

function renderChart(records){
  const bySubject = aggregateBySubject(records);
  const labels = Object.keys(bySubject);
  const data = Object.values(bySubject);
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";

  const ctx = document.getElementById("subjectChart");
  if(subjectChart) subjectChart.destroy();
  subjectChart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: ["#6366f1","#ec4899","#f59e0b","#10b981","#3b82f6","#ef4444","#8b5cf6"],
        borderColor: isDark ? "#151b2b" : "#ffffff",
        borderWidth: 3,
        hoverOffset: 6
      }]
    },
    options: {
      cutout: "62%",
      plugins:{ legend:{ position:"bottom", labels:{ font:{ size:12, weight:600 }, color: isDark ? "#f3f4f6" : "#0f172a", padding:14 } } }
    }
  });
}

async function refreshAll(){
  const records = await fetchRecords();
  lastRecords = records;
  renderStats(records);
  renderRanking(records);
  renderChart(records);
}

const tabButtons = document.querySelectorAll(".tab-btn");
const segIndicator = document.getElementById("segIndicator");
function moveIndicator(idx){
  segIndicator.style.transform = `translateX(${idx * 100}%)`;
}
tabButtons.forEach((btn, idx) => {
  btn.addEventListener("click", () => {
    tabButtons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    moveIndicator(idx);
    currentRange = btn.dataset.range;
    const titles = {today:"🏆 오늘의 랭킹", week:"🏆 이번 주 랭킹", all:"🏆 전체 누적 랭킹"};
    document.getElementById("rankTitle").textContent = titles[currentRange];
    renderRanking(lastRecords);
  });
});

document.getElementById("logForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("nameInput").value.trim();
  const subject = document.getElementById("subjectInput").value;
  const minutes = Number(document.getElementById("minutesInput").value);
  if(!name || !minutes || minutes <= 0) return;

  const submitBtn = document.getElementById("submitBtn");
  const statusEl = document.getElementById("formStatus");
  submitBtn.disabled = true;
  statusEl.className = "status";
  statusEl.innerHTML = `<span class="spinner"></span>저장 중...`;

  try{
    await submitRecord({
      name, subject, minutes,
      date: todayStr(),
      timestamp: new Date().toISOString()
    });
    document.getElementById("minutesInput").value = "";
    statusEl.className = "status success";
    statusEl.textContent = "✓ 저장 완료! 랭킹에 반영됐어요.";
    await refreshAll();
  }catch(err){
    statusEl.className = "status error";
    statusEl.textContent = "저장 실패: 인터넷 연결이나 API 주소를 확인해주세요.";
  }finally{
    submitBtn.disabled = false;
    setTimeout(() => { statusEl.textContent = ""; statusEl.className = "status"; }, 2500);
  }
});

if(!API_URL){
  document.getElementById("setupBanner").style.display = "block";
}
refreshAll();
</script>
</body>
</html>
